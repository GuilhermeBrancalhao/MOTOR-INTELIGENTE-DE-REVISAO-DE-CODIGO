[pytest]
# Duas suítes vivem neste repositório, e cada uma tem o seu próprio pacote
# `ferramentas`: o do motor (raiz) e o do acervo (`acervo/ferramentas`). Numa
# única sessão de pytest os dois colidem — o nome do pacote é o mesmo, o
# primeiro a ser importado ganha, e os testes do outro falham na coleta com
# erro de import que não tem nada a ver com o código.
#
# Por isso a raiz coleta SÓ a suíte do motor, e o acervo se roda de dentro dele:
#
#     py -m pytest                 # motor  (da raiz)
#     cd acervo && py -m pytest    # acervo
#
# Renomear um dos pacotes resolveria a colisão, mas quebraria o repositório
# público do acervo, que é onde a plataforma continua sendo publicada.
testpaths = ferramentas/tests
norecursedirs = acervo volumes docs .git __pycache__ .pytest_cache .superpowers engine-test scratch_test_dir2
